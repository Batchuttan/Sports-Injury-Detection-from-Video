name: Build, Test and Deploy Platform

on:
  push:
    branches:
      - main
      - Aizal-Begene-Melite
  pull_request:
    branches:
      - main
      - Aizal-Begene-Melite

jobs:
  backend-test-and-build:
    name: Backend CI / CD (FastAPI & AI Models)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (OpenCV & FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1-mesa-glx libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Syntax and Import Checks
        run: |
          python -c "import fastapi, uvicorn, cv2, ultralytics; print('All Backend AI Core Libraries Imported Successfully')"

      - name: Build Backend Docker Image
        run: |
          docker build -t sports-injury-backend:latest ./backend

  frontend-test-and-build:
    name: Frontend CI / CD (Next.js & Biomechanical UI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Next.js Standalone
        run: |
          cd frontend
          npm run build

      - name: Build Frontend Docker Image
        run: |
          docker build -t sports-injury-frontend:latest ./frontend

  docker-compose-validation:
    name: Multi-Container Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-test-and-build, frontend-test-and-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

