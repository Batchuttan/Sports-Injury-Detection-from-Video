version: '3.8'

services:
  backend:
    image: ${AZURE_ACR_LOGIN_SERVER}/sports-injury-backend:latest
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./sql_app.db
      - SECRET_KEY=${APP_SECRET_KEY:-sports-injury-secret-key-prod-supersecure}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    restart: always

  frontend:
    image: ${AZURE_ACR_LOGIN_SERVER}/sports-injury-frontend:latest
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
    restart: always
